seed = 0
parent_dir = "exp/wilt/wilt_dp_eps_9_best"
real_data_path = "data/wilt/"
model_type = "mlp"
num_numerical_features = 5
device = "cuda:0"

[model_params]
num_classes = 2
is_y_cond = true

[model_params.rtdl_params]
d_layers = [
    1024,
    512,
    512,
    512,
    512,
    512,
    512,
    128,
]
dropout = 0.0

[diffusion_params]
num_timesteps = 1000
gaussian_loss_type = "mse"
scheduler = "cosine"

[train.main]
steps = 400
lr = 0.00436436456821403
